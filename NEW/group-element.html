<!DOCTYPE html>
<html>
<head>
    <title>HTML Dive Tag</title>
</head>
<body>
    <!-- First group of tags -->
    <div style="background-color: rgb(214, 121, 121);">
        <h4><b>This is frist group</b></h4>
        <p>List items are listed below.</p>
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
    </div>

<!-- Second group of tags -->
    <div style="background-color: rgb(89, 201, 104);">
        <h4><i>This is second group</i></h4>
        <p>Paragraphs are listed below.</p>
        <ul>
            <li>Item 1</li>
            <li>Item 2</li>
            <li>Item 3</li>
        </ul>
    </div>
</body>
</html>
