<!DOCTYPE html>
<html>
    <head>
        <title>Login Form</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: Arial, Helvetica, sans-serif sans-serif;
            }
            body {
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                background: #135552;
            }
            .container {
                background-color: #0e6931;
                padding: 20px;
                display: flex;
                flex-direction: column;
                border-radius: 20px;
                box-shadow: 0 4 10px rgba(0, 0, 0, 0.2);
                text-align: center;
            }
            h1 {
                margin-bottom: 20px;
                color: white;
            }
            input {
                width: 100%;
                padding: 10px;
                margin-top: 10px;
                border-radius: 10px;
                border: none;
                outline: none;
                font-size: 16px;
            }
            input[type="submit"] {
                background-color: #252525;
                color: #fff;
                font-weight: bold;
                padding: 15px;
                cursor: pointer;
                text-transform: uppercase;
                transition: 0.3s;
            }
            input[type="submit"]:hover {
                background-color: yellowgreen;
            }
            p {
                margin-top: 20px;
            }
            a {
                color: #ffffff;
            }
            a:hover {
                color: #000000;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Login</h1>
            <form>
                <input type="text" name="username" placeholder="Enter Username" required />
                <input type="password"  name="password" placeholder="Password" required />
                <input type="submit" name="submit" value="Login" />
            </form>
            <p>Don't have an account? <a href="#">Register Here</a></p>
        </div>
    </body>
</html>
