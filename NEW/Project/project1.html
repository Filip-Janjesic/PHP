<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Interactive To Do Listi</title>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
            body {
                display: flex;
                margin: 0;
                background-color: #f4f4f4;
                justify-content: center;
                align-items: center;
                height: 100vh;
                font-family: "Poppins", sans-serif;
            }
            .container {
                background-color: white;
                width: 350px;
                padding: 20px;
                border-radius: 10px;
                box-shadow: 0 0px 10px rgba(0,0,0,0.2);
            }
            .todo-input {
                display: flex;
                justify-content: space-between;
            }
            input {
                padding: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
                flex: 1;
            }
            button {
                padding: 10px;
                background-color: #4caf50;
                color: white;
                border: none;
                border-radius: 5px;
                margin-left: 10px;
                cursor: pointer;
            }
            ul {
                list-style-type: none;
                padding: 0;
                margin-top: 15px;
            }
            li {
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 10px;
                background-color: #f9f9f9;
                border-radius: 5px;
                margin-bottom: 5px;
            }
            .delete-btn {
                background-color: #f44336;
            }
            li.completed {
                text-decoration: line-through;
                background-color: #d3ffd3;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>To Do List</h1>
            <div class="todo-input">
                <input type="text" id="taskInput" placeholder="Enter Task">
                <button>Add Task</button>
            </div>
            <ul id="taskList">
                <li class="completed">Task 1 <button class="delete-btn">Delete</button></li>
                <li>Task 1 <button class="delete-btn">Delete</button></li>
                <li>Task 3 <button class="delete-btn">Delete</button></li>
                <li>Task 4 <button class="delete-btn">Delete</button></li>
            </ul>
        </div>
    </body>
</html>
