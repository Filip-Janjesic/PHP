<!DOCTYPE html>
<html>
  <head>
    <title>HTML Dive Tag</title>
  </head>
  <body>
    <!-- First group of tags-->
    <div style="background-color: red">
      <h4>This is first group</h4>
      <p>List items are <b>listed</b> below</p>
      <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
      </ul>
    </div>

    <!--Second group of tags -->
    <div style="background-color: aqua">
      <h4>This is second group</h4>
      <p>List items are <b>listed</b> below</p>
      <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
      </ul>
    </div>
  </body>
</html>
