<!DOCTYPE html>
<html>
  <head>
    <title>HTML Formatting Tags</title>
  </head>
  <body>
    <h3>HTML Formatting Tags</h3>

    <p>This is <b>paragraph</b></p>
    <p>This is <i>paragraph</i></p>
    <p>This is <u>paragraph</u></p>
    <p><strike>This is paragraph</strike></p>

    <p>This is <strong>Strong text</strong></p>
  </body>
</html>
