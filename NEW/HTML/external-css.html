<!DOCTYPE html>
<html>
<head>
    <title>External CSS in HTML</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <h2>Inline CSS Example</h2>
    
    <p class="red">This paragraph is styled using inline CSS. The text is red.</p>
    <p class="font_bold" >This paragraph is styled using inline CSS. The text is bold.</p>
    <p class="green">This paragraph is styled using inline CSS. The text is green.</p>
    <p class="green_bold">This paragraph is styled using inline CSS. The text is greenand bold.</p>

</body>
</html>
