<!DOCTYPE html>
<html>
<head>
    <title>HTML ID Attribute</title>
</head>
<body>

    <!-- ID Attribute -->
    <p id="html">This paragraph has an ID attribute with the value "html".</p>
    <p id="css">This paragraph has an ID attribute with the value "css".</p>

    <!-- Title Attribute -->
    <h1 title="heading tag">This is a heading tag with Title</h1>

    <!-- Class Attribute -->
    <p class="paragraph_text single_line test_class">This paragraph text.</p>

    <!-- Style Attribute -->
     <p 
     style="
     font-size: 20px; 
     font-family: 'Courier New', Courier, monospace; 
     color: blue;">
        This paragraph is styled with the style attribute to have a font size of 20 pixels and blue color.
     </p>

</body>
</html>
