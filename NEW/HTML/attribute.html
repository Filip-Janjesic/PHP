<!DOCTYPE html>
<html>
  <head>
    <title>HTML ID Attribute</title>
  </head>
  <body>
    <!-- ID Attribute  -->
    <p id="html">This is paragraph which having ID attribute What is HTML</p>
    <p id="css">This is paragraph which having ID attribute What is CSS</p>

    <!-- Title Attribute -->
    <h1 title="Heading Tag">This heading tag with Title</h1>
    <!-- Class Attribute -->
    <p class="pagraph_text single_line test_class">This is paragraph text</p>

    <!-- The Style attribute-->
    <p
      style="
        font-size: 20px;
        font-family: 'Courier New', Courier, monospace;
        color: red;
      "
    >
      This is sample text to describe Style attribute
    </p>
  </body>
</html>
