<!DOCTYPE html>
<html>
  <head>
    <title>Inline element in HTML</title>
  </head>
  <body>
    <h3>Inline Element</h3>
    <!-- Using <b> inline element-->
    <p>This is <b>paragraph</b> in bold</p>

    <!-- Using <i> inline element -->
    <p>This paragraph in <i>italic</i></p>
  </body>
</html>
