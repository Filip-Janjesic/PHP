<!DOCTYPE html>
<html>
  <head>
    <title>Internal CSS in HTML</title>
    <style>
      .red {
        color: red;
      }
      .font_bold {
        font-weight: bold;
      }
      .green {
        color: green;
      }
      .green_bold {
        color: green;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>Internal CSS</h2>

    <p class="red">This is pragraph in red</p>
    <p class="font_bold">This paragraph in bold</p>
    <p class="green">This paragraph in Green</p>
    <p class="green_bold">This paragraph in Green and bold</p>
  </body>
</html>
