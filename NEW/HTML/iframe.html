<!DOCTYPE html>
<html>
  <head>
    <title>Iframe in HTML</title>
    <style>
      .my_frame {
        width: 90%;
        height: 500px;
        border: 5px solid red;
      }
    </style>
  </head>
  <body>
    <h3>Iframe in HTML Web page</h3>

    <!-- Iframe Syntax -->

    <!-- <iframe src="external-file-name" title="describe about the iframe"></iframe> -->

    <iframe src="image.html" title="Image Web Page" class="my_frame"></iframe>

    <iframe src="inline-css.html" width="500" height="500"></iframe>

    <!-- Google Map -->
    <iframe
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d193596.26002806186!2d-74.14431244705199!3d40.697284634899496!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c258f97bdb102b%3A0xea9f8fc0b3ffff55!2sThe%20Museum%20of%20Modern%20Art!5e0!3m2!1sen!2sin!4v1738146113798!5m2!1sen!2sin"
      width="600"
      height="450"
      style="border: 0"
      allowfullscreen=""
      loading="lazy"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
  </body>
</html>
