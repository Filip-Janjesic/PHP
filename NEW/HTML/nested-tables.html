<!DOCTYPE html>
<html>
  <head>
    <title>Nested HTML Tables</title>
  </head>
  <body>
    <h2>Table with in a table</h2>

    <table border="1">
      <tr>
        <td>First Column of outer table</td>

        <td>
          <table border="1">
            <tr>
              <td>First Row of Inner Table</td>
            </tr>
            <tr>
              <td>Second Row of Inner Table</td>
            </tr>
          </table>
        </td>
      </tr>
      <tr>
        <td>Second Row of outer table</td>
      </tr>
    </table>
  </body>
</html>
