<!DOCTYPE html>
<html>
<head>
    <title>Inline CSS in HTML</title>
</head>
<body>
    <h2 style="color: blue;">Inline CSS Example</h2>
    
    <p style="color: red;">This paragraph is styled using inline CSS. The text is red.</p>
    <p style="font-weight: bold">This paragraph is styled using inline CSS. The text is bold.</p>
    <p style="color: green;">This paragraph is styled using inline CSS. The text is green.</p>
    <p style="color: green; font-weight: bold">This paragraph is styled using inline CSS. The text is greenand bold.</p>

</body>
</html>
