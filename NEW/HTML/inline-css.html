<!DOCTYPE html>
<html>
  <head>
    <title>Inline CSS in HTML</title>
  </head>
  <body>
    <h2>Inline CSS</h2>

    <p style="color: red">This is pragraph in red</p>
    <p style="font-weight: bold">This paragraph in bold</p>
    <p style="color: green">This paragraph in Green</p>
    <p style="color: green; font-weight: bold">
      This paragraph in Green and bold
    </p>
  </body>
</html>
